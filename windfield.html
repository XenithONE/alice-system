    <title>WIND FIELD // 歩ける草原 — AlicE sYsTeM</title>
    <meta
      name="description"
      content="WIND FIELD — 百万本の草がコンピュートシェーダで揺れる、歩けるWebGPUの草原。地形も風も一度のディスパッチで計算され、足元の高さと草の根元は同じ配列から来る。"
    />
    <meta name="theme-color" content="#f2f3f5" />
    <!-- Same theme boot as index.html: theme.css is shared by every document
         on this site, so "dark" has to be decided the same way here. -->
    <script>
      try {
        if (localStorage.getItem("alice_theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#061c31");
        }
      } catch (e) {}
    </script>
    <!-- Same motion boot. Missing this is a silent failure: the class is simply
         absent and every html.motion-on rule in the shared stylesheet dies on
         this page alone, with no error anywhere. -->
    <script>
      try {
        var m = localStorage.getItem("alice_motion");
        if (m === "on" || (m !== "off" && matchMedia("(prefers-reduced-motion: no-preference)").matches)) {
          document.documentElement.classList.add("motion-on");
        }
      } catch (e) {}
    </script>
