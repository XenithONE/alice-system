      name="description"
      content="LONG GALLERY — AlicE sYsTeM の全作品を、曲線の回廊に掛けた WebGPU の3Dギャラリー。スクロールで歩き、額の前で止まるとその作品へ入れる。非対応の環境では作品一覧としてそのまま読める。"
    />
    <meta name="theme-color" content="#f2f3f5" />
    <!-- Same theme boot as index.html. theme.css is a chunk shared by every
         document on this site, so "dark" must be decided the same way here or
         the shared stylesheet would mean two different things. -->
    <script>
      try {
        if (localStorage.getItem("alice_theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#061c31");
        }
      } catch (e) {}
    </script>
    <!-- Same motion boot as index.html / harbor.html. Missing this script is a
         silent failure with no error anywhere — the class is simply absent and
         every html.motion-on rule in the shared stylesheet dies on this page
         alone. It is copied rather than imported because it has to run before
         first paint, ahead of any module. -->
    <script>
      try {
        var m = localStorage.getItem("alice_motion");
        if (m === "on" || (m !== "off" && matchMedia("(prefers-reduced-motion: no-preference)").matches)) {
          document.documentElement.classList.add("motion-on");
        }
      } catch (e) {}
    </script>
