<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor mobile QA frame</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #061c31; }
      body { display: grid; place-items: start center; padding: 18px; }
      iframe {
        width: 390px;
        height: 844px;
        border: 0;
        border-radius: 28px;
        background: #061c31;
        box-shadow: 0 28px 72px rgba(0, 0, 0, 0.42);
        transform: scale(0.8);
        transform-origin: top center;
      }
    </style>
  </head>
  <body>
    <iframe
      src="/alice-system/?q=high&amp;mobile=1"
      title="AlicE sYsTeM mobile viewport"
    ></iframe>
  </body>
</html>
